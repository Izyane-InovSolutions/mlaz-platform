# Verification only: lint, format, types, tests, builds, dependency audit and secret scan. Never deploys (Vercel
# deploys the UI on its own). Make the three jobs required checks on `main` in the branch protection settings
# (see docs/QUALITY_CHECKS.md, "CI").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays: catch newly published advisories even when nothing changed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types, UI tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm run check:lockfile
      - run: npm ci
      - run: npm ci
        working-directory: server
        env:
          # postinstall runs `prisma generate`, which loads prisma.config.ts and needs the variable set. It never
          # connects, so a placeholder will do; this job has no database.
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:server
      - run: npm test # after the build, so the CSP test also checks the built bundle

  server-tests:
    name: API tests (incl. security regression tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway database that exists only for this job.
          POSTGRES_USER: mlaz
          POSTGRES_PASSWORD: mlaz
          POSTGRES_DB: mlaz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mlaz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mlaz:mlaz@localhost:5432/mlaz_test
      DATABASE_URL: postgresql://mlaz:mlaz@localhost:5432/mlaz_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Generate per-run test secrets (no repository secrets are used)
        run: |
          for v in JWT_SECRET DATA_ENCRYPTION_KEY WEBHOOK_SECRET; do
            s=$(openssl rand -base64 48 | tr -d '\n'); echo "::add-mask::$s"; echo "$v=$s" >> "$GITHUB_ENV"
          done
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  security:
    name: Dependency audit, secret scan and diff check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan covers the whole history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Dependency audit (policy in audit-policy.json)
        run: npm run security:deps
      - name: Secret scan (full history)
        run: node scripts/gitleaks.mjs --history
      - name: Whitespace errors in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE" "$HEAD"
