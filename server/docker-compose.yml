# Local PostgreSQL for development and tests, on port 5435 to stay clear of other local Postgres instances.
# The explicit project name keeps this stack separate from other compose projects in folders called "server".
name: mlaz-platform
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlaz
      POSTGRES_PASSWORD: mlaz
      POSTGRES_DB: mlaz
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - mlaz-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlaz"]
      interval: 5s
      retries: 10

volumes:
  mlaz-db:
